<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Duy Tool Online - Check Friends & Avatar</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 20px; background: #eceff1; }
        .container { max-width: 850px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; margin-top: 0; }
        .server-info { text-align: center; font-size: 18px; color: #1565c0; font-weight: bold; margin-bottom: 20px; padding: 10px; background: #e3f2fd; border-radius: 8px; display: none; }
        .login-box { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; }
        input { padding: 10px; border: 1px solid #cfd8dc; border-radius: 6px; width: 150px; }
        button { padding: 10px 20px; background: #1e88e5; color: white; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; }
        button:hover { background: #1565c0; }
        #status { display: block; text-align: center; margin-bottom: 15px; font-weight: bold; color: #546e7a; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #e0e0e0; padding: 12px; text-align: center; vertical-align: middle; }
        th { background: #f5f5f5; color: #455a64; }
        .online { color: #2e7d32; font-weight: bold; }
        .offline { color: #c62828; font-weight: bold; }
        .grade-badge { background: #ff9800; color: white; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
        
        /* Box chứa Avatar */
        .avatar-container {
            width: 120px;
            height: 120px;
            position: relative;
            margin: auto;
            background: #f0f0f0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ccc;
        }
        
        /* CSS bắt buộc để hiển thị và crop khung ảnh đầu tiên của nhân vật */
        .avatar-layer {
            position: absolute;
            top: -25px; /* Kéo nhân vật lên để lấy phần thân trên */
            left: 0;
            width: 120px; /* Chiều rộng chuẩn của 1 frame Gunny */
            height: 175px; /* Chiều cao chuẩn của 1 frame Gunny */
            background-position: left top;
            background-repeat: no-repeat;
            transform-origin: top center;
            transform: scale(1.15); /* Phóng to nhẹ cho vừa khung 120x120 */
            image-rendering: pixelated; /* Giữ độ nét của pixel art */
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Gunny Tool - Check Server & Friends</h2>
    
    <div id="serverInfo" class="server-info">
        Đang tải thông tin server...
    </div>

    <div class="login-box">
        <input type="text" id="user" placeholder="Tài khoản">
        <input type="password" id="pass" placeholder="Mật khẩu">
        <button onclick="startCheck()">ĐĂNG NHẬP & QUÉT</button>
    </div>

    <div id="status">Nhập tài khoản để bắt đầu...</div>

    <table id="friendsTable">
        <thead>
            <tr>
                <th>Nhân vật</th>
                <th>Thông tin</th>
                <th>Bang Hội</th>
                <th>Trạng thái</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</div>

<script>
    const PROXY = "https://duy-proxy.acechuon94.workers.dev/?url="; 
    let itemTemplateMap = {}; 

    // 1. Tải TemplateAllList.xml
    async function loadTemplateAllList() {
        try {
            document.getElementById('status').innerText = "📦 Đang tải dữ liệu trang bị (TemplateAllList)...";
            const templateUrl = `${PROXY}${encodeURIComponent(`https://quest1.gakiemhiep.top/templatealllist.xml?rnd=${Math.random()}`)}`;
            
            const response = await fetch(templateUrl);
            const arrayBuffer = await response.arrayBuffer();
            const uint8Array = new Uint8Array(arrayBuffer);

            let decodedXml;
            try {
                const idx = uint8Array.indexOf(0x78);
                const dataToDecompress = idx >= 0 ? uint8Array.slice(idx) : uint8Array;
                decodedXml = pako.inflate(dataToDecompress, { to: 'string' });
            } catch (e) {
                decodedXml = new TextDecoder().decode(uint8Array);
            }

            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(decodedXml, "text/xml");
            const items = xmlDoc.getElementsByTagName("Item");

            for (let item of items) {
                const id = item.getAttribute("TemplateID");
                const pic = item.getAttribute("Pic");
                if (id && pic) {
                    itemTemplateMap[id] = pic;
                }
            }
            console.log(`✅ Đã load xong Template: ${Object.keys(itemTemplateMap).length} items`);
        } catch (e) {
            console.error("Lỗi tải TemplateAllList: ", e);
            throw new Error("Không thể tải dữ liệu trang bị của game.");
        }
    }

  // 2. Hàm sinh HTML hiển thị Avatar từ chuỗi Style
    function renderAvatarHtml(styleStr, isMale) {
        if (!styleStr || styleStr.replace(/,/g, '').length === 0) {
            return '<div class="avatar-container"><span style="font-size:10px;line-height:120px;">Trần truồng</span></div>';
        }

        const sexChar = isMale == "true" ? "m" : "f";
        const equipBaseUrl = "https://res.gakiemhiep.top/image/equip";
        
        const styleIds = styleStr.split(','); 
        let layers = [];
        
        // 1. Thêm Body mặc định (lớp dưới cùng)
        layers.push(`${equipBaseUrl}/${sexChar}/body/default/show.png`);

        // 2. Lọc các layer trang bị
        for (let id of styleIds) {
            const cleanId = id.split('|')[0];
            if (!cleanId || cleanId === "") continue;

            const pic = itemTemplateMap[cleanId]; 
            if (!pic) continue; 
            
            let folder = "";
            if (pic.startsWith("cloth")) folder = "cloth";
            else if (pic.startsWith("face")) folder = "face";
            else if (pic.startsWith("hair")) folder = "hair";
            else if (pic.startsWith("glass")) folder = "glass";
            else if (pic.startsWith("head")) folder = "head";
            else if (pic.startsWith("eff")) folder = "eff";
            else if (pic.startsWith("wing")) folder = "wing";
            // Bỏ qua vũ khí (arm) và các vật phẩm không hiển thị trên avatar web
            else continue; 
            
            // 3. Đưa lại toàn bộ về show.png. Khung CSS sẽ tự động crop frame đầu tiên.
            if (folder === "hair") {
                layers.push(`${equipBaseUrl}/${sexChar}/${folder}/${pic}/1/b/show.png`);
            } 
            else if (folder === "cloth") {
                layers.push(`${equipBaseUrl}/${sexChar}/${folder}/${pic}/1/show.png`); 
                layers.push(`${equipBaseUrl}/${sexChar}/${folder}/${pic}/3/show.png`); 
            } 
            else {
                layers.push(`${equipBaseUrl}/${sexChar}/${folder}/${pic}/1/show.png`);
            }
        }

        // 4. Render các layer
        let imgTags = layers.map(url => {
            const proxiedUrl = `${PROXY}${encodeURIComponent(url)}`;
            return `<div class="avatar-layer" style="background-image: url('${proxiedUrl}')"></div>`;
        }).join('');

        return `<div class="avatar-container">${imgTags}</div>`;
    }

    // 3. Check Server Status
    async function checkServerStatus() {
        try {
            const serverUrl = `${PROXY}${encodeURIComponent(`https://quest1.gakiemhiep.top/serverlist.ashx?rnd=${Math.random()}`)}`;
            const res = await fetch(serverUrl).then(r => r.text());
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(res, "text/xml");
            const item = xmlDoc.getElementsByTagName("Item")[0];
            
            if(item) {
                const online = item.getAttribute("Online");
                const sName = item.getAttribute("Name");
                const serverDiv = document.getElementById("serverInfo");
                serverDiv.style.display = "block";
                serverDiv.innerHTML = `🌐 Máy chủ: ${sName} | 🟢 Đang Online: <span style="color:red; font-size: 22px;">${online}</span> người`;
            }
        } catch(e) {
            console.error("Lỗi lấy thông tin server: ", e);
        }
    }

    // 4. Luồng xử lý chính
    async function startCheck() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        const status = document.getElementById('status');
        const tbody = document.querySelector('#friendsTable tbody');

        if(!u || !p) return alert("Vui lòng nhập đủ tài khoản và mật khẩu!");

        try {
            tbody.innerHTML = "";
            
            if (Object.keys(itemTemplateMap).length === 0) {
                await loadTemplateAllList();
            }

            status.innerText = "🚀 Đang kiểm tra Server...";
            await checkServerStatus();

            status.innerText = "🔑 Đang đăng nhập hệ thống...";
            
            // Code giả lập đăng nhập, lấy Real ID & Key
            const realID = "154"; 
            const key = "f0adab566981f1306011b1ebab1d9520";

            status.innerText = "📡 Đang tải danh sách bạn bè...";
            const friendsUrl = `${PROXY}${encodeURIComponent(`https://quest1.gakiemhiep.top/imlistload.ashx?key=${key}&uname=${u}&selfid=${realID}&id=${realID}&rnd=${Math.random()}`)}`;
            
            const response = await fetch(friendsUrl);
            const arrayBuffer = await response.arrayBuffer();
            const uint8Array = new Uint8Array(arrayBuffer);

            status.innerText = "📂 Đang giải mã dữ liệu...";
            let decodedXml;
            try {
                const idx = uint8Array.indexOf(0x78);
                const dataToDecompress = idx >= 0 ? uint8Array.slice(idx) : uint8Array;
                decodedXml = pako.inflate(dataToDecompress, { to: 'string' });
            } catch (e) {
                decodedXml = new TextDecoder().decode(uint8Array);
            }

            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(decodedXml, "text/xml");
            const items = xmlDoc.getElementsByTagName("Item");

            if(items.length === 0) {
                status.innerText = "📭 Danh sách bạn bè trống.";
                return;
            }

            for (let item of items) {
                const nick = item.getAttribute("NickName");
                const grade = item.getAttribute("Grade");
                const state = item.getAttribute("State"); 
                const style = item.getAttribute("Style");
                const sex = item.getAttribute("Sex");
                const consortia = item.getAttribute("ConsortiaName") || "Không có";

                const avatarHtml = renderAvatarHtml(style, sex);

                const row = `<tr>
                    <td>${avatarHtml}</td>
                    <td>
                        <strong>${nick}</strong><br>
                        <span class="grade-badge">Lv.${grade}</span>
                    </td>
                    <td>${consortia}</td>
                    <td class="${state == "1" ? "online" : "offline"}">
                        ${state == "1" ? "🟢 ONLINE" : "🔴 OFFLINE"}
                    </td>
                </tr>`;
                tbody.innerHTML += row;
            }

            status.innerText = `✅ Đã quét xong ${items.length} người bạn!`;
            status.style.color = "green";

        } catch (e) {
            status.innerText = "❌ Lỗi: " + e.message;
            status.style.color = "red";
            console.error(e);
        }
    }
</script>

</body>
</html>
